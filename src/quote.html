<div class="card cta" id="quote">
<h2>Get matched with a print partner</h2>
<p>Tell us what you need. We’ll connect you with a suitable large-format printer, wholesale lab or equipment supplier.</p>
<form id="qf">
<label class="f">What do you need?
<select id="qt"><option value="print">Printing for a business or space (murals, large prints, signs)</option><option value="lab">A wholesale pro lab for my photography business</option><option value="equip">Equipment to start or grow a print business</option></select></label>
<div class="row" style="margin-top:12px"><label class="f">Budget<select id="qb"><option value="">Not sure yet</option><option>Under $500</option><option>$500 to $2,000</option><option>$2,000 to $10,000</option><option>$10,000 to $50,000</option><option>$50,000+</option></select></label>
<label class="f">Timeline<select id="qm"><option value="">Flexible</option><option>As soon as possible</option><option>Within 1 month</option><option>1 to 3 months</option><option>Just researching</option></select></label></div>
<label class="f" style="margin-top:12px">Company or studio (optional)<input type="text" id="qc" autocomplete="organization"></label>
<label class="f" style="margin-top:12px">Country<input type="text" id="qy" autocomplete="country-name" placeholder="United States" required></label>
<label class="f" style="margin-top:12px">Email<input type="email" id="qe" required autocomplete="email" placeholder="you@company.com"></label>
<label class="f" style="margin-top:12px">Details (optional)<textarea id="qd" placeholder="Location, quantity, sizes, deadline"></textarea></label>
<input type="text" id="qh" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<label class="chk"><input type="checkbox" id="qk" required><span>I agree that photoprint.io may share this request with relevant print partners or suppliers who may contact me. See the <a href="/privacy/">privacy policy</a>.</span></label>
<button class="btn" type="submit">Request a quote</button>
<div class="cap" id="qs" role="status"></div>
</form>
</div>
